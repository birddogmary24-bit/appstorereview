steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-f'
    - 'Dockerfile.collect'
    - '-t'
    - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/appscope-collect:latest'
    - '.'
images:
- '${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/appscope-collect:latest'
substitutions:
  _REGION: asia-northeast3
options:
  logging: CLOUD_LOGGING_ONLY
